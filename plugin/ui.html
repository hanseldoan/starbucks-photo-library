<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Starbucks Photos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --radius: 5px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 11px;
    background: var(--figma-color-bg, #ffffff);
    color: var(--figma-color-text, #000000e5);
    height: 600px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top toolbar: search only, full width (help icon moved out of this row) */
  .top-toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 16px 8px;
    flex-shrink: 0;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
    height: 24px;
    border-radius: var(--radius);
    background: var(--figma-color-bg-secondary, #f5f5f5);
  }

  .search-wrap:focus-within { box-shadow: 0 0 0 1px var(--figma-color-border-selected, #0d99ff); }

  .search-icon {
    position: absolute;
    left: 6px;
    color: var(--figma-color-icon-tertiary, #0000004d);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 24px;
    padding: 0 24px 0 26px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 11px;
    color: var(--figma-color-text, #000000e5);
    background: transparent;
    outline: none;
  }

  .search-input::placeholder { color: var(--figma-color-text-tertiary, #0000004d); }

  .clear-btn {
    position: absolute;
    right: 0;
    width: 24px;
    height: 24px;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    color: var(--figma-color-icon-tertiary, #0000004d);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .clear-btn:hover { color: var(--figma-color-icon, #000000e5); }
  .clear-btn[hidden] { display: none; }

  /* Second toolbar row: sort control (left) + help icon (right).
     New row — the help icon used to live in the top toolbar next to
     search; it now lives here instead, same click behavior. */
  .sort-toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 16px 8px;
    flex-shrink: 0;
  }

  .sort-btn {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
    padding: 0 4px 0 0;
    border: none;
    border-radius: var(--radius);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s;
  }

  .sort-btn:hover { background: var(--figma-color-bg-hover, #f5f5f5); }

  .sort-icon {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--figma-color-icon-secondary, #0000007f);
    /* Rotates 180° each time sort order flips — a small confirming
       motion so the toggle reads as "reversed," not just relabeled. */
    transition: transform 0.25s ease;
  }

  .sort-label {
    flex: 1;
    min-width: 0;
    text-align: left;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.055px;
    line-height: 16px;
    color: var(--figma-color-text-secondary, #0000007f);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Help button — now a circular icon pill instead of a plain square
     icon button, so it reads clearly even sitting next to the sort
     label instead of next to the search field. Same toggle behavior
     as before: tap to open/close the help text below. */
  .help-btn {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    color: var(--figma-color-icon, #000000e5);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .help-btn:hover:not(.active) { background: var(--figma-color-bg-hover, #ececec); }

  .help-btn.active {
    background: var(--figma-color-bg-selected, #e5f4ff);
    border-color: var(--figma-color-border-selected, #0d99ff);
    color: var(--figma-color-icon-brand, #0d99ff);
  }

  /* Help text — hidden until the help icon is tapped */
  .help-panel {
    display: none;
    flex-direction: column;
    gap: 4px;
    padding: 0 16px 16px;
    flex-shrink: 0;
  }

  .help-panel.open { display: flex; }

  .help-panel p {
    font-size: 11px;
    line-height: 16px;
    color: var(--figma-color-text, #000000e5);
  }

  .help-meta {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    color: var(--figma-color-text-tertiary, #0000004d);
  }

  /* Grid — masonry, preserved */
  .grid-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    border-top: 0.5px solid var(--figma-color-border, #e6e6e6);
    border-bottom: 0.5px solid var(--figma-color-border, #e6e6e6);
    scrollbar-width: thin;
    scrollbar-color: var(--figma-color-border, #e6e6e6) transparent;
  }

  .grid {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .masonry-col {
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 8px;
  }

  .card {
    position: relative;
    width: 100%;
    border-radius: var(--radius);
    border: 1px solid var(--figma-color-border, #e6e6e6);
    overflow: hidden;
    cursor: pointer;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  }

  .card img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.2s;
  }

  .card-skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--figma-color-bg-secondary, #f5f5f5) 25%, var(--figma-color-bg-tertiary, #e6e6e6) 50%, var(--figma-color-bg-secondary, #f5f5f5) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }

  .card:hover {
    border-color: var(--figma-color-border-selected, #0d99ff);
    transform: scale(1.01);
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }

  .card.selected {
    border: 1.5px solid var(--figma-color-border-selected, #0d99ff);
  }

  .card img.loading { opacity: 0; }
  .card img.loaded { opacity: 1; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Selected badge — rounded square, matching the kit's radius everywhere else (not a circle) */
  .card-check {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 16px;
    height: 16px;
    background: var(--figma-color-bg-brand, #0d99ff);
    border: 1px solid var(--figma-color-border-selected-strong, #007be5);
    border-radius: var(--radius);
    display: none;
    align-items: center;
    justify-content: center;
  }

  .card.selected .card-check { display: flex; }

  .no-results {
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    color: var(--figma-color-text-tertiary, #0000004d);
    font-size: 11px;
  }

  /* Footer — status line + single primary action.
     No separate Cancel button: Figma's own title bar already gives you a close (X). */
  .footer {
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .status-text {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--figma-color-text, #000000e5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .btn-primary {
    width: 100%;
    height: 24px;
    border-radius: var(--radius);
    border: none;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: var(--figma-color-text-onbrand, #ffffff);
    transition: background 0.15s;
  }

  .btn-primary:hover:not(:disabled) { background: var(--figma-color-bg-brand-hover, #007be5); }
  .btn-primary:disabled {
    background: var(--figma-color-bg-disabled, #d9d9d9);
    color: var(--figma-color-text-disabled, #0000004d);
    cursor: not-allowed;
  }

  /* Loading overlay */
  .inserting-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
  }

  .inserting-overlay.active { display: flex; }

  .spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .inserting-text {
    color: #fff;
    font-size: 11px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="top-toolbar">
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input class="search-input" id="search" type="text" placeholder="Search photos" />
    <button class="clear-btn" id="clearBtn" aria-label="Clear search" title="Clear search" type="button" hidden>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="sort-toolbar">
  <button class="sort-btn" id="sortBtn" type="button" aria-label="Sort: Newest to Oldest. Click to switch to Oldest to Newest." title="Sort: Newest to Oldest">
    <span class="sort-icon" id="sortIcon">
      <!-- Swap/reorder glyph. Figma's exact "icon.24.swap.small" vector
           couldn't be exported in this environment (Figma's asset host
           blocks the fetch here), so this is a hand-coded equivalent —
           same two-arrow loop shape, same stroke style as the rest of
           this file's icons. Swap in the exact exported SVG later if
           pixel-parity with the kit matters. -->
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="19.17 3.33 19.17 8.33 14.17 8.33"/>
        <polyline points="0.83 16.67 0.83 11.67 5.83 11.67"/>
        <path d="M2.93 7.5a7.5 7.5 0 0 1 12.38-2.8L19.17 8.33"/>
        <path d="M0.83 11.67l3.87 3.63A7.5 7.5 0 0 0 17.08 12.5"/>
      </svg>
    </span>
    <span class="sort-label" id="sortLabel">Newest to Oldest</span>
  </button>
  <button class="help-btn" id="helpBtn" aria-label="Help" title="Help">
    <svg width="14" height="14" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M7.6 7.6c.2-1 1.1-1.7 2.2-1.7 1.2 0 2.2.8 2.2 1.9 0 .9-.5 1.3-1.3 1.8-.6.4-.9.7-.9 1.3v.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="10" cy="13.9" r="0.9" fill="currentColor"/>
    </svg>
  </button>
</div>

<div class="help-panel" id="helpPanel">
  <p>Fill a selected frame and shape with a photo. Or place it directly on the canvas.</p>
  <div class="help-meta">
    <span id="helpCount">217 Photos</span>
    <span>·</span>
    <span id="helpUpdated">August 2026</span>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  <div class="status-text" id="statusText">217 images</div>
  <button class="btn-primary" id="insertBtn" disabled>Insert</button>
</div>

<div class="inserting-overlay" id="overlay">
  <div class="spinner"></div>
  <div class="inserting-text">Inserting photo…</div>
</div>

<script>
let IMAGES = [];
let selectedUrl = null;
let filtered = [];

// Sort state — 'desc' = Newest to Oldest (default, matches the design),
// 'asc' = Oldest to Newest. Toggled by clicking the swap icon/button;
// search and sort are independent, so switching one never resets the other.
let sortDir = 'desc';
let sortIconRotation = 0;

const SORT_LABELS = {
  desc: 'Newest to Oldest',
  asc: 'Oldest to Newest',
};

window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'init') {
    IMAGES = msg.images;
    filtered = [...IMAGES];
    document.getElementById('helpCount').textContent = `${IMAGES.length} Photo${IMAGES.length !== 1 ? 's' : ''}`;
    document.getElementById('helpUpdated').textContent = msg.lastUpdated || '';
    render();
  }
  if (msg.type === 'insert-done') {
    document.getElementById('overlay').classList.remove('active');
  }
  if (msg.type === 'insert-error') {
    document.getElementById('overlay').classList.remove('active');
    alert('Could not insert photo: ' + msg.message);
  }
};

document.getElementById('helpBtn').addEventListener('click', () => {
  document.getElementById('helpPanel').classList.toggle('open');
  document.getElementById('helpBtn').classList.toggle('active');
});

// Returns `items` sorted by photo timestamp according to the current
// sortDir. Photos with no timestamp (shouldn't normally happen, but the
// scraper data is external input) sort to the end either way rather than
// jumping to the top.
function sortImages(items) {
  return [...items].sort((a, b) => {
    const ta = a.timestamp ? new Date(a.timestamp).getTime() : NaN;
    const tb = b.timestamp ? new Date(b.timestamp).getTime() : NaN;
    const aMissing = Number.isNaN(ta);
    const bMissing = Number.isNaN(tb);
    if (aMissing && bMissing) return 0;
    if (aMissing) return 1;
    if (bMissing) return -1;
    return sortDir === 'desc' ? tb - ta : ta - tb;
  });
}

// Single place that re-renders the grid + status line + sort label from
// current state (filtered list + sortDir + selectedUrl). Called after
// search, after sort toggle, and after selecting/deselecting a photo.
function render() {
  renderGrid(sortImages(filtered));
  updateStatus();
}

document.getElementById('sortBtn').addEventListener('click', () => {
  sortDir = sortDir === 'desc' ? 'asc' : 'desc';

  const label = document.getElementById('sortLabel');
  label.textContent = SORT_LABELS[sortDir];

  const sortBtn = document.getElementById('sortBtn');
  sortBtn.setAttribute('aria-label', `Sort: ${SORT_LABELS[sortDir]}. Click to switch to ${SORT_LABELS[sortDir === 'desc' ? 'asc' : 'desc']}.`);
  sortBtn.setAttribute('title', `Sort: ${SORT_LABELS[sortDir]}`);

  // Rotate the icon another 180° each click (never snapping back) so the
  // toggle reads as a reversal rather than just a text swap.
  sortIconRotation += 180;
  document.getElementById('sortIcon').style.transform = `rotate(${sortIconRotation}deg)`;

  render();
});

function makeCard(img) {
  const skelId = 'skel-' + btoa(img.url).replace(/=/g, '').slice(-8);
  return `
    <div class="card ${selectedUrl === img.url ? 'selected' : ''}" onclick="selectImage('${img.url}')" title="${img.label}">
      <div class="card-skeleton" id="${skelId}"></div>
      <img
        src="${img.url}"
        alt="${img.label}"
        class="loading"
        onload="this.classList.remove('loading'); this.classList.add('loaded'); const s=document.getElementById('${skelId}'); if(s) s.remove();"
        onerror="this.closest('.card').style.opacity='0.4';"
      />
      <div class="card-check">
        <svg width="9" height="8" viewBox="0 0 9 8" fill="none">
          <path d="M1 4l2.2 2.2L8 1" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>`;
}

function renderGrid(items) {
  const grid = document.getElementById('grid');

  if (items.length === 0) {
    grid.innerHTML = `<div class="no-results">No photos match your search.</div>`;
    return;
  }

  const col1 = items.filter((_, i) => i % 2 === 0);
  const col2 = items.filter((_, i) => i % 2 === 1);

  grid.innerHTML = `
    <div class="masonry-col">${col1.map(makeCard).join('')}</div>
    <div class="masonry-col">${col2.map(makeCard).join('')}</div>
  `;
}

function updateStatus() {
  const status = document.getElementById('statusText');
  if (selectedUrl) {
    const item = IMAGES.find(i => i.url === selectedUrl);
    status.textContent = item ? item.label : '';
  } else {
    status.textContent = `${filtered.length} image${filtered.length !== 1 ? 's' : ''}`;
  }
}

function selectImage(url) {
  selectedUrl = selectedUrl === url ? null : url;
  document.getElementById('insertBtn').disabled = !selectedUrl;
  render();
}

function insertSelected() {
  if (!selectedUrl) return;
  document.getElementById('overlay').classList.add('active');

  const img = new Image();
  img.crossOrigin = "anonymous";

  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) {
          document.getElementById('overlay').classList.remove('active');
          alert('Could not read photo pixels.');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const bytes = Array.from(new Uint8Array(reader.result));
          parent.postMessage({ pluginMessage: {
            type: 'insert-image',
            bytes,
            width: img.naturalWidth,
            height: img.naturalHeight
          }}, '*');
        };
        reader.readAsArrayBuffer(blob);
      }, 'image/png');
    } catch (e) {
      document.getElementById('overlay').classList.remove('active');
      alert('Canvas error: ' + e.message);
    }
  };

  img.onerror = () => {
    fetch(selectedUrl)
      .then(r => r.blob())
      .then(blob => {
        const reader = new FileReader();
        reader.onload = () => {
          const bytes = Array.from(new Uint8Array(reader.result));
          parent.postMessage({ pluginMessage: { type: 'insert-image', bytes } }, '*');
        };
        reader.readAsArrayBuffer(blob);
      })
      .catch(err => {
        document.getElementById('overlay').classList.remove('active');
        alert('Could not load photo: ' + err.message);
      });
  };

  img.src = selectedUrl;
}

const searchInput = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');

function applySearch(q) {
  filtered = q ? IMAGES.filter(img => img.label.toLowerCase().includes(q)) : [...IMAGES];
  if (selectedUrl && !filtered.find(i => i.url === selectedUrl)) {
    selectedUrl = null;
    document.getElementById('insertBtn').disabled = true;
  }
  render();
}

searchInput.addEventListener('input', (e) => {
  clearBtn.hidden = e.target.value.length === 0;
  applySearch(e.target.value.toLowerCase().trim());
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.hidden = true;
  applySearch('');
  searchInput.focus();
});

document.getElementById('insertBtn').addEventListener('click', insertSelected);
</script>
</body>
</html>
