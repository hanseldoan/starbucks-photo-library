<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starbucks Photo Library</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #faf7f2;
    color: #1c1b1a;
    padding: 24px;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 20px; }
  .status { font-size: 13px; color: #6b6b6b; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  button {
    border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #00754a; color: #fff; }
  .btn-secondary { background: #e5e0d8; color: #1c1b1a; }
  .btn-publish { background: #1c1b1a; color: #fff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .card {
    position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; background: #fff;
  }
  .card.selected { border-color: #00754a; }
  .card img { width: 100%; height: 130px; object-fit: cover; display: block; }
  .card .label { font-size: 11px; padding: 6px 8px; color: #333; }
  .card .check {
    position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .card.selected .check { background: #00754a; border-color: #00754a; color: #fff; }
  .empty { padding: 40px; text-align: center; color: #888; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Starbucks Photo Library</h1>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="toolbar">
    <button class="btn-primary" id="scanBtn">Scan for Photos</button>
    <button class="btn-secondary" id="downloadBtn" disabled>Download Selected</button>
    <button class="btn-publish" id="publishBtn" disabled>Publish Selected to Library</button>
  </div>
</header>

<div id="grid" class="grid"></div>

<script>
  let images = [];
  const selected = new Set();

  const statusEl = document.getElementById("status");
  const gridEl = document.getElementById("grid");
  const scanBtn = document.getElementById("scanBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const publishBtn = document.getElementById("publishBtn");

  async function loadImages() {
    statusEl.textContent = "Loading…";
    const res = await fetch("/api/images");
    images = await res.json();
    render();
  }

  function render() {
    statusEl.textContent = `${images.length} photo${images.length === 1 ? "" : "s"} in database · ${selected.size} selected`;
    downloadBtn.disabled = selected.size === 0;
    publishBtn.disabled = selected.size === 0;

    if (images.length === 0) {
      gridEl.innerHTML = `<div class="empty">No photos yet. Click "Scan for Photos" to run a scrape.</div>`;
      return;
    }

    gridEl.innerHTML = images
      .map(
        (img, i) => `
      <div class="card ${selected.has(img.url) ? "selected" : ""}" data-i="${i}">
        <div class="check">${selected.has(img.url) ? "✓" : ""}</div>
        <img src="${img.url}" loading="lazy" alt="${img.title || ""}" />
        <div class="label">${img.figmaLabel || img.title || ""}</div>
      </div>`
      )
      .join("");

    gridEl.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        const img = images[parseInt(card.dataset.i, 10)];
        if (selected.has(img.url)) selected.delete(img.url);
        else selected.add(img.url);
        render();
      });
    });
  }

  scanBtn.addEventListener("click", async () => {
    scanBtn.disabled = true;
    statusEl.textContent = "Scraping started — this runs in the background, check back in a bit…";
    await fetch("/api/scrape", { method: "POST" });
    scanBtn.disabled = false;
    // Poll once after a delay; a real deployment might use SSE/polling for live progress.
    setTimeout(loadImages, 60000);
  });

  downloadBtn.addEventListener("click", async () => {
    const urls = Array.from(selected);
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls }),
    });
    const blob = await res.blob();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "starbucks-images.zip";
    link.click();
  });

  publishBtn.addEventListener("click", async () => {
    const urls = Array.from(selected);
    publishBtn.disabled = true;
    statusEl.textContent = "Publishing to GitHub…";
    try {
      const res = await fetch("/api/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Publish failed");
      statusEl.textContent = `Published ${data.published} photos. Commit: ${data.commitUrl}`;
    } catch (e) {
      statusEl.textContent = `Publish failed: ${e.message}`;
    }
    publishBtn.disabled = false;
  });

  loadImages();
</script>
</body>
</html>
